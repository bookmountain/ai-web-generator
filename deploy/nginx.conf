server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;

    location = /_health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Keep application bundles outside the six-character deployed-app namespace.
    location ^~ /app-assets/ {
        try_files $uri =404;
    }

    location ~ "^/(?<deploy_key>[a-z0-9]{6})(?<deploy_path>/.*)?$" {
        root /data/code_deploy;
        try_files /$deploy_key$deploy_path /$deploy_key$deploy_path/ /$deploy_key/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
