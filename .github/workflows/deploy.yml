name: CI and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        env:
          VITE_API_BASE_URL: /api
          VITE_DEPLOY_DOMAIN: https://ai-web-generator.bookmountain.work
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: ./mvnw -B -DskipTests package

  deploy:
    needs: verify
    runs-on: [self-hosted, linux, x64, ai-web-generator]
    timeout-minutes: 30
    environment:
      name: production
      url: https://ai-web-generator.bookmountain.work
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Sync release to VPS
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'config/application-local.yml' \
            --exclude 'tmp/' \
            ./ /opt/ai-web-generator/

      - name: Deploy and verify
        run: |
          set -eu
          cd /opt/ai-web-generator
          show_diagnostics() {
            docker compose ps
            docker compose logs --tail=100
          }
          trap show_diagnostics ERR

          docker compose up -d --build --remove-orphans
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3083/_health >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3083/api/health/ \
            | grep --quiet '"code":0'

          homepage=$(curl --fail --silent http://127.0.0.1:3083/)
          printf '%s' "$homepage" | grep --quiet '/app-assets/.*\.js'
          printf '%s' "$homepage" | grep --quiet '/app-assets/.*\.css'
          printf '%s' "$homepage" \
            | grep -oE '/app-assets/[^" ]+\.(js|css)' \
            | sort -u \
            | while read -r asset; do
                curl --fail --silent "http://127.0.0.1:3083${asset}" >/dev/null
              done

          anonymous_response=$(curl --fail --silent \
            http://127.0.0.1:3083/api/user/get/login)
          printf '%s' "$anonymous_response" | grep --quiet '"code":40100'

          trap - ERR
